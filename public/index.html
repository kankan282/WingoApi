<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wingo Live Results</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;padding:15px}
h1{text-align:center;color:#00ff88;font-size:22px;margin-bottom:10px}
.live{display:inline-block;width:10px;height:10px;background:#f00;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.tabs{display:flex;justify-content:center;gap:8px;margin:15px 0;flex-wrap:wrap}
.tab{padding:10px 20px;border:2px solid #333;border-radius:25px;background:transparent;color:#888;
font-weight:bold;cursor:pointer;font-size:14px;transition:.3s}
.tab.active{background:#00ff88;color:#000;border-color:#00ff88}
.stats{display:flex;justify-content:center;gap:15px;margin:15px 0;flex-wrap:wrap}
.stat{background:#111;padding:10px 18px;border-radius:10px;text-align:center;min-width:80px}
.stat .v{font-size:22px;font-weight:bold}
.stat .l{font-size:11px;color:#666}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:600px;margin:15px auto}
.ball{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-weight:bold;font-size:16px;color:#fff;cursor:pointer;transition:.2s}
.ball:hover{transform:scale(1.3);z-index:1}
.red{background:#e74c3c}.green{background:#2ecc71}
.red-violet{background:linear-gradient(135deg,#e74c3c 50%,#9b59b6 50%)}
.green-violet{background:linear-gradient(135deg,#2ecc71 50%,#9b59b6 50%)}
table{width:100%;max-width:700px;margin:20px auto;border-collapse:collapse}
th,td{padding:10px;text-align:center;border-bottom:1px solid #222;font-size:13px}
th{background:#111;color:#00ff88}
.mini-ball{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;
justify-content:center;font-size:12px;font-weight:bold;color:#fff}
.new-row{animation:glow 2s ease-out}
@keyframes glow{0%{background:rgba(0,255,136,.2)}100%{background:transparent}}
</style>
</head>
<body>

<h1>🎮 WINGO LIVE <span class="live"></span></h1>

<div class="tabs">
    <button class="tab active" onclick="switchGame('30sec',this)">⚡ 30 Sec</button>
    <button class="tab" onclick="switchGame('1min',this)">⏱ 1 Min</button>
    <button class="tab" onclick="switchGame('3min',this)">⏳ 3 Min</button>
    <button class="tab" onclick="switchGame('5min',this)">🕐 5 Min</button>
</div>

<div class="stats">
    <div class="stat"><div class="v" id="sTotal">0</div><div class="l">Total</div></div>
    <div class="stat"><div class="v" id="sRed" style="color:#e74c3c">0</div><div class="l">Red</div></div>
    <div class="stat"><div class="v" id="sGreen" style="color:#2ecc71">0</div><div class="l">Green</div></div>
    <div class="stat"><div class="v" id="sViolet" style="color:#9b59b6">0</div><div class="l">Violet</div></div>
    <div class="stat"><div class="v" id="sBig">0</div><div class="l">Big</div></div>
    <div class="stat"><div class="v" id="sSmall">0</div><div class="l">Small</div></div>
</div>

<h3 style="text-align:center;color:#555">Last 100 Results</h3>
<div class="grid" id="grid"></div>

<table>
<thead><tr><th>Period</th><th>Num</th><th>Color</th><th>B/S</th><th>O/E</th></tr></thead>
<tbody id="tbody"></tbody>
</table>

<script>
const socket = io();
let game = '30sec', data = [];

function switchGame(g, btn) {
    game = g;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    socket.emit('join', game);
}

socket.on('connect', () => socket.emit('join', game));

socket.on('history', (rows) => { data = rows; render(); });

socket.on('new_result', (r) => {
    data.unshift(r);
    if (data.length > 200) data.pop();
    render();
});

function render() {
    const last100 = data.slice(0, 100);
    
    // Grid
    document.getElementById('grid').innerHTML = last100.map(r =>
        `<div class="ball ${r.color}" title="${r.period}">${r.number}</div>`
    ).join('');

    // Table
    document.getElementById('tbody').innerHTML = last100.slice(0, 30).map((r, i) =>
        `<tr class="${i === 0 ? 'new-row' : ''}">
            <td style="font-size:11px">${r.period}</td>
            <td><span class="mini-ball ${r.color}">${r.number}</span></td>
            <td>${r.color}</td>
            <td>${r.bigSmall}</td>
            <td>${r.oddEven}</td>
        </tr>`
    ).join('');

    // Stats
    let red=0, green=0, violet=0, big=0, small=0;
    last100.forEach(r => {
        if (r.color.includes('red')) red++;
        if (r.color.includes('green')) green++;
        if (r.color.includes('violet')) violet++;
        if (r.bigSmall === 'big') big++; else small++;
    });
    document.getElementById('sTotal').textContent = last100.length;
    document.getElementById('sRed').textContent = red;
    document.getElementById('sGreen').textContent = green;
    document.getElementById('sViolet').textContent = violet;
    document.getElementById('sBig').textContent = big;
    document.getElementById('sSmall').textContent = small;
}
</script>
</body>
</html>
