<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wingo Live Results & AI Prediction</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;padding:15px}
h1{text-align:center;color:#00ff88;font-size:22px;margin-bottom:10px}
.live{display:inline-block;width:10px;height:10px;background:#f00;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.tabs{display:flex;justify-content:center;gap:8px;margin:15px 0;flex-wrap:wrap}
.tab{padding:10px 20px;border:2px solid #333;border-radius:25px;background:transparent;color:#888;font-weight:bold;cursor:pointer;font-size:14px;transition:.3s}
.tab.active{background:#00ff88;color:#000;border-color:#00ff88}

/* PREDICTION BOX */
.pred-card{max-width:600px;margin:15px auto;background:linear-gradient(135deg, #1e1e38 0%, #111124 100%);border:2px solid #3b82f6;border-radius:15px;padding:15px;box-shadow:0 0 20px rgba(59,130,246,0.2)}
.pred-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:8px;margin-bottom:12px}
.pred-title{font-size:16px;color:#38bdf8;font-weight:bold;display:flex;align-items:center;gap:6px}
.pred-conf{background:#22c55e;color:#000;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold}
.pred-body{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.pred-item{background:#0f172a;padding:10px;border-radius:8px}
.pred-item .label{font-size:11px;color:#94a3b8;margin-bottom:4px}
.pred-item .val{font-size:18px;font-weight:bold;text-transform:uppercase}
.pred-reason{text-align:center;font-size:12px;color:#cbd5e1;margin-top:10px;font-style:italic}

.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:600px;margin:15px auto}
.ball{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;color:#fff;cursor:pointer;transition:.2s}
.ball:hover{transform:scale(1.3);z-index:1}
.red{background:#e74c3c}.green{background:#2ecc71}
.red-violet{background:linear-gradient(135deg,#e74c3c 50%,#9b59b6 50%)}
.green-violet{background:linear-gradient(135deg,#2ecc71 50%,#9b59b6 50%)}

table{width:100%;max-width:700px;margin:20px auto;border-collapse:collapse}
th,td{padding:10px;text-align:center;border-bottom:1px solid #222;font-size:13px}
th{background:#111;color:#00ff88}
.mini-ball{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff}
.new-row{animation:glow 2s ease-out}
@keyframes glow{0%{background:rgba(0,255,136,.2)}100%{background:transparent}}
</style>
</head>
<body>

<h1>🎮 WINGO LIVE + AI PREDICTOR <span class="live"></span></h1>

<div class="tabs">
    <button class="tab active" onclick="switchGame('30sec',this)">⚡ 30 Sec</button>
    <button class="tab" onclick="switchGame('1min',this)">⏱ 1 Min</button>
    <button class="tab" onclick="switchGame('3min',this)">⏳ 3 Min</button>
    <button class="tab" onclick="switchGame('5min',this)">🕐 5 Min</button>
</div>

<!-- 🎯 AI PREDICTION CARD -->
<div class="pred-card">
    <div class="pred-header">
        <div class="pred-title">🤖 AI NEXT PERIOD PREDICTION</div>
        <div class="pred-conf" id="pConfidence">80% Accuracy</div>
    </div>
    <div class="pred-body">
        <div class="pred-item">
            <div class="label">NEXT COLOR</div>
            <div class="val" id="pColor" style="color:#22c55e">GREEN</div>
        </div>
        <div class="pred-item">
            <div class="label">BIG / SMALL</div>
            <div class="val" id="pBigSmall" style="color:#38bdf8">BIG</div>
        </div>
        <div class="pred-item">
            <div class="label">BEST NUMBERS</div>
            <div class="val" id="pNumbers" style="color:#f59e0b">5, 7, 9</div>
        </div>
    </div>
    <div class="pred-reason" id="pReason">Analyzing trends...</div>
</div>

<h3 style="text-align:center;color:#888;margin-top:20px;">Last 100 Results Balls</h3>
<div class="grid" id="grid"></div>

<table>
<thead><tr><th>Period</th><th>Number</th><th>Color</th><th>Big/Small</th><th>Odd/Even</th></tr></thead>
<tbody id="tbody"></tbody>
</table>

<script>
const socket = io();
let game = '30sec', data = [];

function switchGame(g, btn) {
    game = g;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    socket.emit('join', game);
}

socket.on('connect', () => socket.emit('join', game));

socket.on('initial_data', (payload) => {
    data = payload.history;
    render();
    renderPrediction(payload.prediction);
});

socket.on('new_result', (payload) => {
    data.unshift(payload.result);
    if (data.length > 200) data.pop();
    render();
    renderPrediction(payload.prediction);
});

function renderPrediction(p) {
    if (!p) return;
    document.getElementById('pConfidence').textContent = p.confidence + ' Accuracy';
    
    const pColorEl = document.getElementById('pColor');
    pColorEl.textContent = p.predictedColor.toUpperCase();
    pColorEl.style.color = p.predictedColor === 'red' ? '#ef4444' : '#22c55e';

    document.getElementById('pBigSmall').textContent = p.predictedBigSmall.toUpperCase();
    document.getElementById('pNumbers').textContent = p.recommendedNumbers.join(', ');
    document.getElementById('pReason').textContent = 'Logic: ' + p.patternReason;
}

function render() {
    const last100 = data.slice(0, 100);
    
    // Grid
    document.getElementById('grid').innerHTML = last100.map(r =>
        `<div class="ball ${r.color}" title="${r.period}">${r.number}</div>`
    ).join('');

    // Table
    document.getElementById('tbody').innerHTML = last100.slice(0, 30).map((r, i) =>
        `<tr class="${i === 0 ? 'new-row' : ''}">
            <td style="font-size:11px">${r.period}</td>
            <td><span class="mini-ball ${r.color}">${r.number}</span></td>
            <td>${r.color}</td>
            <td>${r.bigSmall.toUpperCase()}</td>
            <td>${r.oddEven.toUpperCase()}</td>
        </tr>`
    ).join('');
}
</script>
</body>
</html>
